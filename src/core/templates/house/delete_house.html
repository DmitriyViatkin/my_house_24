{% extends "index.html" %}

{% block content %}
  <div class="content-wrapper">
    <section class="content-header">
      <h1>Удаление дома</h1>
      <ul class="breadcrumb">
        <li>
          <a href="{% url 'admin:home' %}"><i class="fa fa-home"></i> Главная</a>
        </li>
        <li>
          <a href="{% url 'admin:house' %}">Дома</a>
        </li>
        <li class="active">Удаление дома</li>
      </ul>
    </section>
    <section class="content">
      <div class="box box-danger">
        <div class="box-header with-border">
          <h3 class="box-title">Подтвердите удаление</h3>
        </div>
        <div class="box-body">
          <p>Вы действительно хотите удалить этот дом?</p>
        </div>
        <div class="box-footer">
          <form method="post" action="{% url 'admin:delete_house' house.id %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'admin:house' %}" class="btn btn-default">Отмена</a>
          </form>
        </div>
      </div>
    </section>
  </div>
{% endblock  %}
