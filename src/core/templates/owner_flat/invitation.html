{% extends "index.html" %}

{% block content %}
  <div class="content-wrapper">
    <section class="content-header">
      <h1>Пригласить владельца квартир</h1>
      <ul class="breadcrumb">
        <li>
          <a href="{% url 'admin_home' %}"><i class="fa fa-home"></i> Главная</a>
        </li>
        <li>
          <a href="{% url 'owner_flat_list' %}">Владельцы квартир</a>
        </li>
        <li class="active">Пригласить владельца квартир</li>
      </ul>
    </section>
    <section class="content">
      <div class="box">
        <div class="box-header with-border">
          <h3 class="box-title">Отправить приглашение</h3>
        </div>
        <div class="box-body">
          <form id="w0" action="{% url 'invite_owner' %}" method="post">
            <input type="hidden"
                   name="_csrf-backend"
                   value="s7lMJAdvsT5eRxPXzY4A7wToLQ7iiGHbLr70gdIQN6niihZWdFnpcRMjcqOdzC2NNrBFRKG-KJptyo3mu0gBzw==" />
            <div class="row">
              <div class="col-xs-12 col-sm-6">
                <div class="form-group field-phone">
                  <label class="control-label" for="phone">Телефон</label>
                  <input type="text"
                         id="phone"
                         class="form-control"
                         name="phone"
                         value=""
                         placeholder="+380991234567" />
                </div>
                <div class="form-group field-email">
                  <label class="control-label" for="email">Email</label>
                  <input type="text"
                         id="email"
                         class="form-control"
                         name="email"
                         value=""
                         placeholder="info@example.com" />
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-xs-12 text-center">
                <div class="form-group">
                  <button type="submit" class="btn btn-success">Отправить приглашение</button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </section>
  </div>
{% endblock content %}
