{% extends "index.html" %}

{% load static %}

<style>
  .content-minheight {
    min-height: 839px;
  }
</style>
{% block content %}
  <div class="content-wrapper content-minheight">
    <section class="content-header">
      <h2>Удалить пользователя</h2>
      <p>Вы уверены, что хотите удалить пользователя "{{ object.username }}"?</p>
      <form method="post">
        {% csrf_token %}
        <input type="submit" value="Подтвердить удаление" class="btn btn-danger" />
        <a href="{% url 'admin:user-admin' %}" class="btn btn-secondary">Отмена</a>
      </form>
    </section>
  </div>
{% endblock content %}
