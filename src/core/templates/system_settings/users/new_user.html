{% extends '/index.html' %}

{% block content %}
  <div class="content-wrapper" style="min-height: 839px;">
    <section class="content-header">
      <h1>Новый пользователь</h1>
      <ul class="breadcrumb">
        <li>
          <a href="/admin/"><i class="fa fa-home"></i> Главная</a>
        </li>
        <li>
          <a href="/admin/user-admin/index">Пользователи</a>
        </li>
        <li class="active">Новый пользователь</li>
      </ul>
    </section>
    <section class="content">
      <div class="box">
        <div class="box-body">
          <form id="w0" action="/admin/user-admin/create" method="post">
            <input type="hidden"
                   name="_csrf-backend"
                   value="9WSDhkCh12TQxKF_KGS_HKFWfPkR6H0IQ5JLR7p8KZWkV9n0M5ePK52gwAt4JpJ-kw4Us1LeNEkA5jIg0yQf8w==" />
            <div class="row">
              <div class="col-xs-12 col-md-6">
                <div class="form-group field-useradminform-firstname">
                  <label class="control-label" for="useradminform-firstname">Имя</label>
                  <input type="text"
                         id="useradminform-firstname"
                         class="form-control"
                         name="UserAdminForm[firstname]"
                         maxlength="255" />
                  <div class="help-block"></div>
                </div>
                <div class="form-group field-useradminform-lastname">
                  <label class="control-label" for="useradminform-lastname">Фамилия</label>
                  <input type="text"
                         id="useradminform-lastname"
                         class="form-control"
                         name="UserAdminForm[lastname]"
                         maxlength="255" />
                  <div class="help-block"></div>
                </div>
                <div class="form-group field-useradminform-phone">
                  <label class="control-label" for="useradminform-phone">Телефон</label>
                  <input type="text"
                         id="useradminform-phone"
                         class="form-control"
                         name="UserAdminForm[phone]"
                         maxlength="255" />
                  <div class="help-block"></div>
                </div>
                <div class="form-group field-useradminform-role">
                  <label class="control-label" for="useradminform-role">Роль</label>
                  <select id="useradminform-role"
                          class="form-control"
                          name="UserAdminForm[role]">
                    <option value="admin">Директор</option>
                    <option value="manager">Управляющий</option>
                    <option value="accountant">Бухгалтер</option>
                    <option value="electrician">Электрик</option>
                    <option value="plumber">Сантехник</option>
                  </select>
                  <div class="help-block"></div>
                </div>
                <div class="form-group field-useradminform-status">
                  <label class="control-label" for="useradminform-status">Статус</label>
                  <select id="useradminform-status"
                          class="form-control"
                          name="UserAdminForm[status]">
                    <option value="10">Активен</option>
                    <option value="5" selected="">Новый</option>
                    <option value="0">Отключен</option>
                  </select>
                  <div class="help-block"></div>
                </div>
              </div>
              <div class="col-xs-12 col-md-6">
                <div class="form-group field-useradminform-username required">
                  <label class="control-label" for="useradminform-username">Email (логин)</label>
                  <input type="text"
                         id="useradminform-username"
                         class="form-control"
                         name="UserAdminForm[username]"
                         maxlength="255"
                         aria-required="true" />
                  <div class="help-block"></div>
                </div>
                <div class="form-group field-useradminform-password">
                  <label class="control-label" for="useradminform-password">Пароль</label>
                  <div class="input-group">
                    <input type="password"
                           id="useradminform-password"
                           class="form-control pass-value"
                           name="UserAdminForm[password]"
                           maxlength="255" />
                    <span class="input-group-btn">
                      <button class="btn btn-default"
                              type="button"
                              onclick="generatePassword('.pass-value')">Сгенерировать</button>
                      <button type="button" class="btn btn-primary" id="showPass">
                        <i class="fa fa-eye" aria-hidden="true"></i>
                      </button>
                    </span>
                  </div>
                  <div class="help-block"></div>
                </div>
                <div class="form-group field-useradminform-password2">
                  <label class="control-label" for="useradminform-password2">Повторить пароль</label>
                  <input type="password"
                         id="useradminform-password2"
                         class="form-control pass-value"
                         name="UserAdminForm[password2]"
                         maxlength="255" />
                  <div class="help-block"></div>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-xs-12 text-right">
                <a href="/admin/user-admin/index" class="btn btn-default">Отменить</a>
                <button type="submit" class="btn btn-success">Сохранить</button>
              </div>
            </div>
          </form>
          <script>
            function generatePassword(targetSelector) {
              var pass = Math.random().toString(36).substring(4);
              $('input' + targetSelector).val(pass);
              $('span' + targetSelector).text(pass);
            }
          </script>
        </div>
      </div>
    </section>
  </div>
{% endblock %}
