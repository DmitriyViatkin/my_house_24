{% extends '/main.html' %}

{% block content %}
  <div class="content-wrapper" style="min-height: 839px;">
    <section class="content-header">
      <h1>Сообщения</h1>
      <ul class="breadcrumb">
        <li>
          <a href="/cabinet/"><i class="fa fa-home"></i> Главная</a>
        </li>
        <li class="active">Сообщения</li>
      </ul>
    </section>
    <section class="content">
      <div class="box">
        <div class="box-header with-border">
          <h3 class="box-title"></h3>
          <div class="box-tools pull-right">
            <div class="has-feedback">
              <form action="" method="get">
                <input type="text"
                       name="search"
                       value=""
                       class="form-control input-sm"
                       placeholder="Поиск" />
                <span class="glyphicon glyphicon-search form-control-feedback"></span>
              </form>
            </div>
          </div>
        </div>
        <div class="box-body no-padding">
          <div id="w0" class="grid-view">
            <div class="mailbox-controls">
              <button type="button" class="btn btn-default btn-sm checkbox-toggle">
                <i class="fa fa-square-o"></i>
              </button>
              <button type="button" class="btn btn-default btn-sm delete-many">
                <i class="fa fa-trash-o"></i>
              </button>
              <div class="pull-right"></div>
            </div>
            <div class="table-responsive mailbox-messages">
              <table class="table table-hover table-striped linkedRow">
                <thead>
                  <tr>
                    <th>&nbsp;</th>
                    <th style="min-width: 200px">От кого</th>
                    <th>Текст</th>
                    <th style="width: 135px; min-width: 135px">Дата</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="4">
                      <div class="empty">Ничего не найдено.</div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="mailbox-controls">
              <button type="button" class="btn btn-default btn-sm checkbox-toggle">
                <i class="fa fa-square-o"></i>
              </button>
              <button type="button" class="btn btn-default btn-sm delete-many">
                <i class="fa fa-trash-o"></i>
              </button>
              <div class="pull-right"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
{% endblock %}
