{% extends 'main.html' %}

{% load static %}

<style>
  .payment-container-wrapper {
    display: flex;
    justify-content: center;
    margin-top: 150px;
  }

  .payment-container {
    max-width: 450px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 30px;
    background: #fff;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
  }

  .payment-options {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25px;
  }

  .option {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    cursor: pointer;
  }

  .option input[type="radio"] {
    transform: scale(1.3);
  }

  .option label {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .logos {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
  }

  .logos img {
    height: 40px;
    transition: transform 0.3s ease;
  }

  .option:hover img {
    transform: scale(1.05);
  }

  .pay-button {
    background-color: #33cc5e;
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 30px;
    transition: 0.3s;
  }

  .pay-button:hover {
    background-color: #2eb757;
  }

  .pay-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* Подсветка выбранного способа оплаты */
  .option.selected {
    border: 2px solid #33cc5e;
    border-radius: 10px;
    padding: 10px 20px;
    background: #f5fff7;
  }
</style>
{% block content %}
  <div class="content-wrapper">
    <section class="content-header">
      <h1>Просмотр квитанции: #{{ invoice.invoice_number }}</h1>
      <ul class="breadcrumb">
      </ul>
    </section>
    <section class="content">
      <div class="payment-container-wrapper">
        <div class="payment-container">
          <form id="paymentForm">
            <div class="payment-options">
              <div class="option">
                <input type="radio" id="privat24" name="payment" value="privat24" />
                <label for="privat24">
                  <img src="{% static 'image/logo_Privat24.png' %}"
                       alt="Privat24"
                       height="50" />
                </label>
              </div>
              <div class="option">
                <input type="radio" id="card" name="payment" value="card" />
                <label for="card">
                  <div class="logos">
                    <img src="{% static 'image/Visa.svg' %}" alt="Visa" />
                    <img src="{% static 'image/master_card.svg' %}" alt="MasterCard" />
                  </div>
                </label>
              </div>
            </div>
            <button type="submit" class="pay-button" disabled>Оплатить</button>
          </form>
        </div>
      </div>
    </section>
  </div>
  <script>
    const STEP2_URL = "{% url 'step2' invoice.pk %}";
    const form = document.getElementById("paymentForm");
    const options = form.querySelectorAll(".option");
    const button = form.querySelector(".pay-button");

    form.addEventListener("change", () => {
      button.disabled = !form.payment.value;
      options.forEach(opt => opt.classList.remove("selected"));
      const selected = form.querySelector(`input[name="payment"]:checked`);
      if (selected) selected.closest(".option").classList.add("selected");
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const selected = form.payment.value;
      if (selected) {
        window.location.href = `${STEP2_URL}?method=${selected}`;
      }
    });
  </script>
{% endblock content %}
