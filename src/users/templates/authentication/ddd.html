<div class="login-box">
  <div class="login-logo">
    <a href="https://myhouse24.demodev.cc/">
      <img src="https://myhouse24.demodev.cc/logo.svg" alt="logo" />
    </a>
  </div>
  <div class="nav-tabs-custom">
    <ul class="nav nav-tabs">
      <li class="active">
        <a href="#tab_1" data-toggle="tab" aria-expanded="true">Для жильца</a>
      </li>
      <li>
        <a href="https://myhouse24.demodev.cc/admin/site/login">Для администрации</a>
      </li>
    </ul>
    <div class="tab-content">
      <div class="tab-pane active" id="tab_1">
        <div class="login-box-body">
          <p class="login-box-msg">Вход в личный кабинет</p>
          <form id="login-form" action="/cabinet/site/login" method="post">
            <input type="hidden"
                   name="_csrf-cabinet"
                   value="GAA1gB42XNZ6ahk-01fzNxQEdz6J6l60wnPQS07CnH4sdHr3cQEm-y0jUm-DJMoObTRFULqrB_C2EOUnGJWxNA==" />
            <div class="form-group has-feedback field-loginform-username required">
              <input type="text"
                     id="loginform-username"
                     class="form-control"
                     name="LoginForm[username]"
                     placeholder="E-mail или ID"
                     aria-required="true" />
              <span class="fa fa-envelope form-control-feedback"></span>
            </div>
            <div class="form-group has-feedback field-loginform-password required">
              <input type="password"
                     id="loginform-password"
                     class="form-control"
                     name="LoginForm[password]"
                     placeholder="Пароль"
                     aria-required="true" />
              <span class="fa fa-lock form-control-feedback"></span>
            </div>
            <div class="row">
              <div class="col-xs-12">
                <div class="checkbox icheck">
                  <input type="hidden" name="LoginForm[rememberMe]" value="0" />
                  <label>
                    <div class="icheckbox_flat-blue checked"
                         aria-checked="false"
                         aria-disabled="false"
                         style="position: relative">
                      <input type="checkbox"
                             id="loginform-rememberme"
                             name="LoginForm[rememberMe]"
                             value="1"
                             checked=""
                             style="position: absolute;
                                    opacity: 0" />
                      <ins class="iCheck-helper"
                           style="position: absolute;
                                  top: 0%;
                                  left: 0%;
                                  display: block;
                                  width: 100%;
                                  height: 100%;
                                  margin: 0px;
                                  padding: 0px;
                                  background: rgb(255, 255, 255);
                                  border: 0px;
                                  opacity: 0"></ins>
                    </div>
                    Запомнить меня
                  </label>
                </div>
              </div>
              <div class="col-xs-12">
                <button type="submit" class="btn btn-primary btn-block" name="login-button">Вход</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
