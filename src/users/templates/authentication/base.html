{% load static %}

<!DOCTYPE html>
<html lang="ru-RU" style="height: auto; min-height: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
          name="viewport" />
    <link rel="icon"
          type="image/png"
          href="https://myhouse24.demodev.cc/favicon.png" />
    <meta name="csrf-param" content="_csrf-backend" />
    <meta name="csrf-token"
          content="IY7vImUdWy3SJT8pnFkR0JgA2J7uGNVucr3DimVs8etO2sJtNVEtQrN3XEKtD3ii-U-35qVCvBcj9Y75AzjCsw==" />
    <title>Вход</title>
    <link href="{% static 'admin/bower_components/bootstrap/dist/css/bootstrap.min.css' %}"
          rel="stylesheet" />
    <link href="{% static 'admin/bower_components/bootstrap-datepicker/dist/css/bootstrap-datepicker.min.css' %}"
          rel="stylesheet" />
    <link href="{% static 'admin/bower_components/font-awesome/css/font-awesome.min.css' %}"
          rel="stylesheet" />
    <link href="{% static 'admin/bower_components/Ionicons/css/ionicons.min.css' %}"
          rel="stylesheet" />
    <link href="{% static 'admin/bower_components/jvectormap/jquery-jvectormap.css' %}"
          rel="stylesheet" />
    <link href="{% static 'admin/dist/css/AdminLTE.min.css' %}"
          rel="stylesheet" />
    <link href="{% static 'admin/plugins/iCheck/flat/blue.css' %}"
          rel="stylesheet" />
    <link href="{% static 'admin/plugins/bootstrap-wysihtml5/bootstrap3-wysihtml5.min.css' %}"
          rel="stylesheet" />
    <link href="{% static 'admin/dist/css/skins/_all-skins.min.css' %}"
          rel="stylesheet" />
    <link href="{% static 'admin/dist/css/style.css' %}" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic"
          rel="stylesheet" />
    <link href="{% static 'admin/custom.css' %}" rel="stylesheet" />
    <link href="{% static 'admin/custom_jqs.css' %}" rel="stylesheet" />
    <style type="text/css">
      .jqstooltip {
        position: absolute;
        left: 0px;
        top: 0px;
        visibility: hidden;
        background: rgb(0, 0, 0) transparent;
        background-color: rgba(0, 0, 0, 0.6);
        filter: progid:DXImageTransform.Microsoft.gradient(startColorstr=#99000000, endColorstr=#99000000);
        -ms-filter: "progid:DXImageTransform.Microsoft.gradient(startColorstr=#99000000, endColorstr=#99000000)";
        color: white;
        font: 10px arial, san serif;
        text-align: left;
        white-space: nowrap;
        padding: 5px;
        border: 1px solid white;
        box-sizing: content-box;
        z-index: 10000;
      }

      .jqsfield {
        color: white;
        font: 10px arial, san serif;
        text-align: left;
      }
    </style>
  </head>
  <body class="login-page" style="height: auto; min-height: 100%;">
    <div class="login-box">
      <div class="login-logo">
        <a href="https://myhouse24.demodev.cc/">
          <img src="https://myhouse24.demodev.cc/logo.svg" alt="logo" />
        </a>
      </div>
      <div class="nav-tabs-custom">
        <ul class="nav nav-tabs">
          <li>
            <a href="https://myhouse24.demodev.cc/cabinet/site/login">Для жильца</a>
          </li>
          <li class="active">
            <a href="#tab_2" data-toggle="tab" aria-expanded="true">Для администрации</a>
          </li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane active" id="tab_1">
            <div class="login-box-body">
              <p class="login-box-msg">Вход в личный кабинет</p>
              <form id="login-form" action="/cabinet/site/login" method="post">
                <input type="hidden"
                       name="_csrf-cabinet"
                       value="GAA1gB42XNZ6ahk-01fzNxQEdz6J6l60wnPQS07CnH4sdHr3cQEm-y0jUm-DJMoObTRFULqrB_C2EOUnGJWxNA==" />
                <div class="form-group has-feedback field-loginform-username required">
                  <input type="text"
                         id="loginform-username"
                         class="form-control"
                         name="LoginForm[username]"
                         placeholder="E-mail или ID"
                         aria-required="true" />
                  <span class="fa fa-envelope form-control-feedback"></span>
                </div>
                <div class="form-group has-feedback field-loginform-password required">
                  <input type="password"
                         id="loginform-password"
                         class="form-control"
                         name="LoginForm[password]"
                         placeholder="Пароль"
                         aria-required="true" />
                  <span class="fa fa-lock form-control-feedback"></span>
                </div>
                <div class="row">
                  <div class="col-xs-12">
                    <div class="checkbox icheck">
                      <input type="hidden" name="LoginForm[rememberMe]" value="0" />
                      <label>
                        <div class="icheckbox_flat-blue checked"
                             aria-checked="false"
                             aria-disabled="false"
                             style="position: relative">
                          <input type="checkbox"
                                 id="loginform-rememberme"
                                 name="LoginForm[rememberMe]"
                                 value="1"
                                 checked=""
                                 style="position: absolute;
                                        opacity: 0" />
                          <ins class="iCheck-helper"
                               style="position: absolute;
                                      top: 0%;
                                      left: 0%;
                                      display: block;
                                      width: 100%;
                                      height: 100%;
                                      margin: 0px;
                                      padding: 0px;
                                      background: rgb(255, 255, 255);
                                      border: 0px;
                                      opacity: 0"></ins>
                        </div>
                        Запомнить меня
                      </label>
                    </div>
                  </div>
                  <div class="col-xs-12">
                    <button type="submit" class="btn btn-primary btn-block" name="login-button">Вход</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="tab-pane active" id="tab_2">
          <div class="login-box-body">
            <p class="login-box-msg">Вход в панель управления</p>
            <form method="post">
              {% csrf_token %}
              <div class="form-group has-feedback">
                {{ form.username }}
                <span class="fa fa-envelope form-control-feedback"></span>
              </div>
              <div class="form-group has-feedback">
                {{ form.password }}
                <span class="fa fa-lock form-control-feedback"></span>
              </div>
              <div class="row">
                <div class="col-xs-12">
                  <button type="submit" class="btn btn-primary btn-block">Вход</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="{% static 'admin/assets/137cc266/jquery.js' %}"></script>
  <script src="{% static 'admin/assets/4da2ea81/yii.js' %}"></script>
  <script src="{% static 'admin/bower_components/bootstrap/dist/js/bootstrap.min.js' %}"></script>
  <script src="{% static 'admin/bower_components/bootstrap-datepicker/dist/js/bootstrap-datepicker.min.js' %}"></script>
  <script src="{% static 'admin/bower_components/fastclick/lib/fastclick.js' %}"></script>
  <script src="{% static 'admin/dist/js/adminlte.min.js' %}"></script>
  <script src="{% static 'admin/plugins/iCheck/icheck.min.js' %}"></script>
  <script src="{% static 'admin/plugins/bootstrap-wysihtml5/bootstrap3-wysihtml5.all.js' %}"></script>
  <script src="{% static 'admin/plugins/bootstrap-wysihtml5/bootstrap-wysihtml5.ru-RU.js' %}"></script>
  <script src="{% static 'admin/bower_components/jquery-sparkline/dist/jquery.sparkline.min.js' %}"></script>
  <script src="{% static 'admin/plugins/jvectormap/jquery-jvectormap-1.2.2.min.js' %}"></script>
  <script src="{% static 'admin/plugins/jvectormap/jquery-jvectormap-world-mill-en.js' %}"></script>
  <script src="{% static 'admin/bower_components/jquery-slimscroll/jquery.slimscroll.min.js' %}"></script>
  <script src="{% static 'admin/bower_components/chart.js/Chart.js' %}"></script>
  <script src="{% static 'admin/dist/js/main.js' %}"></script>
  <script src="{% static 'admin/custom.js' %}"></script>
  <script src="{% static 'admin/diagram.js' %}"></script>
  <script>
    jQuery(function($) {
      jQuery('#login-form').yiiActiveForm([], []);
      $(function() {
        //Enable iCheck plugin for checkboxes
        //iCheck for checkbox and radio inputs
        $('.login-box-body input[type="checkbox"]').iCheck({
          checkboxClass: 'icheckbox_flat-blue',
          radioClass: 'icheckbox_flat-blue'
        });

        $('#preloader').fadeOut('slow', function() {
          $(this).remove();
        });
      });
    });
  </script>
</body>
</html>
