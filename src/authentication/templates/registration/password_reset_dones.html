{% load static %}
<!DOCTYPE html>
<html lang="ru-RU" class="full-height">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="icon" type="image/png" href="https://myhouse24.demodev.cc/favicon.png" />
    <title>Сброс пароля — письмо отправлено</title>

    <!-- CSS -->
    <link href="{% static 'admin/bower_components/bootstrap/dist/css/bootstrap.min.css' %}" rel="stylesheet" />
    <link href="{% static 'admin/dist/css/AdminLTE.min.css' %}" rel="stylesheet" />
    <link href="{% static 'admin/plugins/iCheck/flat/blue.css' %}" rel="stylesheet" />
    <link href="{% static 'admin/custom.css' %}" rel="stylesheet" />

    <style>
      .full-height {
        height: auto;
        min-height: 100%;
      }
      .login-logo img {
        display: block;
        margin: 0 auto;
        max-width: 220px;
      }
      .login-box {
        margin-top: 60px;
      }
      .login-box-body {
        border-radius: 6px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .btn-primary {
        width: 100%;
      }
      .message-box {
        text-align: center;
      }
      .message-box p {
        font-size: 16px;
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body class="login-page full-height">
    <div class="login-box">
      <div class="login-logo">
        <a href="{% url 'main' %}">
          <img src="https://myhouse24.demodev.cc/logo.svg" alt="logo" />
        </a>
      </div>

      <div class="login-box-body message-box">
        <h3><strong>Письмо отправлено!</strong></h3>
        <p>
          Мы отправили ссылку для сброса пароля на указанный вами email.
          Пожалуйста, проверьте свою почту (и папку «Спам», если письмо не пришло).
        </p>

        <a href="{% url 'login' %}" class="btn btn-primary">Вернуться к входу</a>
      </div>
    </div>

    <!-- JS -->
    <script src="{% static 'admin/assets/137cc266/jquery.js' %}"></script>
    <script src="{% static 'admin/bower_components/bootstrap/dist/js/bootstrap.min.js' %}"></script>
  </body>
</html>
