{% load static %}
{% load recaptcha3 %}
<!DOCTYPE html>
<html lang="ru-RU" class="full-height">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="icon" type="image/png" href="https://myhouse24.demodev.cc/favicon.png" />
    <title>Восстановление пароля</title>

    <!-- CSS -->
    <link href="{% static 'admin/bower_components/bootstrap/dist/css/bootstrap.min.css' %}" rel="stylesheet" />
    <link href="{% static 'admin/dist/css/AdminLTE.min.css' %}" rel="stylesheet" />
    <link href="{% static 'admin/plugins/iCheck/flat/blue.css' %}" rel="stylesheet" />
    <link href="{% static 'admin/custom.css' %}" rel="stylesheet" />

    <style>
      .full-height {
        height: auto;
        min-height: 100%;
      }
      .login-logo img {
        display: block;
        margin: 0 auto;
        max-width: 220px;
      }
      .login-box {
        margin-top: 60px;
      }
      .login-box-body {
        border-radius: 6px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      button.btn-primary {
        width: 100%;
      }
    </style>

    <script src="https://www.google.com/recaptcha/api.js?render=6Les2q8rAAAAAOvjjcz_-ninog2x-5IyRVKGrp3G"></script>
    {% recaptcha_init %}
  </head>

  <body class="login-page full-height">
    <div class="login-box">
      <div class="login-logo">
        <a href="{% url 'main' %}">
          <img src="https://myhouse24.demodev.cc/logo.svg" alt="logo" />
        </a>
      </div>

      <div class="login-box-body">
        <p class="login-box-msg"><strong>Восстановление пароля</strong></p>
        <p>Введите свой email, и мы отправим ссылку для сброса пароля.</p>

        <form method="post" id="password-reset-form">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary">Отправить ссылку</button>
        </form>
      </div>
    </div>

    <!-- JS -->
    <script src="{% static 'admin/assets/137cc266/jquery.js' %}"></script>
    <script src="{% static 'admin/bower_components/bootstrap/dist/js/bootstrap.min.js' %}"></script>
    <script>
      // Подключение reCAPTCHA к форме восстановления
      function submitWithRecaptcha(form, actionName) {
        grecaptcha.ready(function () {
          grecaptcha.execute("6Les2q8rAAAAAOvjjcz_-ninog2x-5IyRVKGrp3G", {
            action: actionName
          }).then(function (token) {
            let input = form.querySelector('input[name="g-recaptcha-response"]');
            if (!input) {
              input = document.createElement("input");
              input.type = "hidden";
              input.name = "g-recaptcha-response";
              form.appendChild(input);
            }
            input.value = token;
            form.submit();
          });
        });
      }

      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("password-reset-form");
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          submitWithRecaptcha(form, "password_reset");
        });
      });
    </script>
  </body>
</html>
