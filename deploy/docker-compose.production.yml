version: "3.9"

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: make start-prod
    env_file:
      - .env.production
    depends_on:
      - db
      - redis
    volumes:
      - staticfiles_collected:/app/staticfiles_collected
      - media:/app/media
    networks:
      - app-network

  celery_worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: celery -A settings worker -l info
    env_file:
      - .env.production
    depends_on:
      - db
      - redis
    volumes:
      - media:/app/media
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: my_house_nginx
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - staticfiles_collected:/app/staticfiles_collected:ro
      - media:/app/media:ro
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: redis
    restart: always
    networks:
      - app-network

  db:
    image: postgres:15
    container_name: postgres
    restart: always
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  flower:
    image: mher/flower:latest
    environment:
      - FLOWER_PORT=5555
    command: flower --broker=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  staticfiles_collected:
  media:
