version: "3.9"

services:
  web:
    command: [make start]
    volumes:
      - ..:/app
      - ../media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env.development

  celery_worker:
    command: celery -A settings worker -l info
    volumes:
      - ..:/app
    env_file:
      - .env.development