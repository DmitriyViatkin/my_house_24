services:
  web:
    build: .
    container_name: my_house_web
    command: ["poetry", "run", "python", "manage.py", "runserver", "0.0.0.0:8000"]
    env_file:
      - .env.development
    volumes:
      - .:/app
      - static:/app/static
      - media:/app/media
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    container_name: my_house_db
    restart: always
    env_file:
      - .env.development

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: my_house_redis
    restart: always

  nginx:
    image: nginx:latest
    container_name: my_house_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/:/etc/letsencrypt/
      - static:/app/static
      - media:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
  static:
  media:
